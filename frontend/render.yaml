# Render Blueprint — static SPA (production). Vercel uses vercel.json for the same headers.
# Link this repo in Render Dashboard → Blueprints, or paste headers under Settings → Headers.
# Keep headers in sync with src/lib/securityHeaders.ts (see tests/security/securityHeaders.test.ts).
# Generated by scripts/sync-deploy-headers.mjs — edit vercel.json + securityHeaders.ts, then re-run.
services:
  - type: web
    name: flowdesk-ui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    domains:
      - flowdesk.brightcone.ai
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: blob:; worker-src 'self' blob:; media-src 'self' blob:; frame-src 'self' blob: https://accounts.google.com https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
