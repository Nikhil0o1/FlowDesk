name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowdesk
          POSTGRES_PASSWORD: flowdesk
          POSTGRES_DB: flowdesk
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://flowdesk:flowdesk@localhost:5432/flowdesk
      SECRET_KEY: ci-only-secret-not-used-anywhere-real
      EMAIL_ENABLED: 'false'
      SCHEDULER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate migrations apply cleanly
        run: alembic upgrade head
      - name: Run tests
        run: python -m pytest app/tests -q
