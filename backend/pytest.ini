[pytest]
testpaths = app/tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    unit: Phase 2 unit tests (services, core)
    integration: Phase 3 API integration tests
    security: Phase 4 security and VAPT tests
    regression: Phase 5 regression smoke tests
    coverage: Phase 6+ coverage gap tests (path to 95%)
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient
